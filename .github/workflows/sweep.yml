name: Daily lead user sweep

# Runs the discovery pipeline every night and commits the results. GitHub
# Actions has no request timeout, so the free-tier LLM rate limits that make a
# live search slow are not a problem here — and the site can then render
# pre-computed results instantly.

on:
  schedule:
    # 06:00 UTC daily. GitHub cron is always UTC.
    - cron: "0 6 * * *"
  workflow_dispatch: {} # allows running it by hand from the Actions tab

permissions:
  contents: write

concurrency:
  group: sweep
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run sweep
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLUESKY_IDENTIFIER: ${{ secrets.BLUESKY_IDENTIFIER }}
          BLUESKY_APP_PASSWORD: ${{ secrets.BLUESKY_APP_PASSWORD }}
          MAX_CANDIDATES_TO_CLASSIFY: "30"
        run: npx tsx scripts/sweep.ts

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --staged --quiet; then
            echo "No change in findings today."
            exit 0
          fi

          git commit -m "Sweep $(date -u +%Y-%m-%d): refresh lead user findings"

          # A sweep takes many minutes, so main may have moved while it ran.
          # Rebase onto whatever landed and retry rather than failing the run.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected; rebasing onto origin/main (attempt $attempt)."
            git pull --rebase --autostash origin main
          done

          echo "Could not push after 3 attempts." >&2
          exit 1
