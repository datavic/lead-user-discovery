<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="curve" x1="4" y1="26" x2="28" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#6b93ff" />
      <stop offset="0.55" stop-color="#6b93ff" stop-opacity="0.45" />
      <stop offset="1" stop-color="#6b93ff" stop-opacity="0.15" />
    </linearGradient>
  </defs>

  <rect width="32" height="32" rx="7" fill="#12141c" />

  <!-- Diffusion S-curve: adoption over time, fading toward the mainstream. -->
  <path
    d="M6 25 C 12 25, 12 17, 16 16 C 20 15, 20 7, 26 7"
    fill="none"
    stroke="url(#curve)"
    stroke-width="2.6"
    stroke-linecap="round"
  />

  <!-- The lead user: ahead of the curve, before the mass follows. -->
  <circle cx="9.5" cy="12" r="5.5" fill="#4fb98a" opacity="0.18" />
  <circle cx="9.5" cy="12" r="2.9" fill="#4fb98a" />
</svg>
